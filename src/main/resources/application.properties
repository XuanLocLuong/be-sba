# Server Configuration
server.port=8080

# JWT Configuration
app.auth.tokenSecret=cinemaSystemSecretKey2026@!!Secure@1234567890
app.auth.tokenExpirationMs=86400000

# Logging
logging.level.com.cinema=DEBUG